<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: http: https:; connect-src 'self' http: https:; font-src 'self'"
    />
    <title>Weltempfänger</title>
  </head>
  <body>
    <!-- The faceplate mounts here. Nothing else belongs in this document:
         every pixel of the receiver is generated by src/renderer/ui. -->
    <div id="app"></div>
    <!-- Order is load-bearing. The host publishes window.__weltempfaenger
         synchronously; boot.ts reads it on its first line and mounts the real
         receiver against it. If this script were second, boot.ts would find
         nothing and mount the mock feeder instead. -->
    <script type="module" src="./host/index.ts"></script>
    <script type="module" src="./ui/boot.ts"></script>
  </body>
</html>
